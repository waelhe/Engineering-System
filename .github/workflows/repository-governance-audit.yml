name: PEOS Repository Governance Audit

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Audit active rulesets for canonical main branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/audit_repository_governance.py --config registry/peos/repository-governance.json
