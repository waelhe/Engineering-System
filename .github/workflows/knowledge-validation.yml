name: EGM knowledge and runtime validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      intake_pr_number:
        description: "Optional PR number for trusted, data-only intake validation"
        required: false
        default: ""
        type: string
      intake_head_ref:
        description: "Automation intake branch ref"
        required: false
        default: ""
        type: string
      intake_head_sha:
        description: "Exact automation intake head SHA"
        required: false
        default: ""
        type: string
      intake_base_ref:
        description: "Trusted default-branch ref"
        required: false
        default: ""
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned EGM submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate trusted data-only intake PR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.intake_pr_number != '' }}
        env:
          INTAKE_PR_NUMBER: ${{ inputs.intake_pr_number }}
          INTAKE_HEAD_REF: ${{ inputs.intake_head_ref }}
          INTAKE_HEAD_SHA: ${{ inputs.intake_head_sha }}
          INTAKE_BASE_REF: ${{ inputs.intake_base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          set -eu
          python tools/validate_intake_pr.py \
            --pr-number "$INTAKE_PR_NUMBER" \
            --base-ref "$INTAKE_BASE_REF" \
            --head-ref "$INTAKE_HEAD_REF" \
            --head-sha "$INTAKE_HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --current-ref "$CURRENT_REF"

      - name: Validate knowledge records and relations
        run: python tools/egm_knowledge.py validate

      - name: Reconcile imported records against pinned source manifest
        run: python tools/validate_migration.py

      - name: Validate execution receipts
        run: python tools/egm_knowledge.py validate-receipts

      - name: Verify generated knowledge index
        run: python tools/egm_knowledge.py index --check

      - name: Enforce append-only evidence history
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          python tools/knowledge_guard.py --base "origin/$BASE_REF"

      - name: Run unit tests
        run: python -m pytest

      - name: Build integrated OpenAI runtime package
        run: python tools/build_plugin.py --target openai --output "$RUNNER_TEMP/egm-system-package"

      - name: Build integrated Claude runtime package
        run: python tools/build_plugin.py --target claude --output "$RUNNER_TEMP/egm-system-claude-package"
