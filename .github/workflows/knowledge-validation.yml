name: EGM knowledge and runtime validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned EGM submodule
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate knowledge records and relations
        run: python tools/egm_knowledge.py validate

      - name: Validate execution receipts
        run: python tools/egm_knowledge.py validate-receipts

      - name: Verify generated knowledge index
        run: python tools/egm_knowledge.py index --check

      - name: Enforce append-only evidence history
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          python tools/knowledge_guard.py --base "origin/$BASE_REF"

      - name: Run unit tests
        run: python -m pytest

      - name: Build integrated OpenAI runtime package
        run: python tools/build_plugin.py --target openai --output "$RUNNER_TEMP/egm-system-package"
