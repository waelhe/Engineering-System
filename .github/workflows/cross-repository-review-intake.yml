name: Cross-Repository Review Signal Intake

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional operator context for this source sweep"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: egm-github-review-intake-single-writer
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.repository == 'waelhe/Engineering-System' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted canonical default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"

      - name: Check whether the read-only source App is configured
        id: app-config
        env:
          APP_CLIENT_ID: ${{ vars.EGM_REVIEW_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.EGM_REVIEW_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a short-lived, read-only token for source repositories
        id: source-token
        if: ${{ steps.app-config.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.EGM_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.EGM_REVIEW_APP_PRIVATE_KEY }}
          owner: waelhe
          repositories: |
            app-java-v3
            marketplace-admin
            mobile-marketplace
          permission-pull-requests: read
          permission-issues: read

      - name: Capture source review signals and open a data-only draft PR
        if: ${{ steps.source-token.outputs.token != '' }}
        env:
          EGM_SOURCE_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          python -m tools.cross_repo_review_intake \
            --source-config registry/peos/review-sources.json \
            --event-action "${GITHUB_EVENT_NAME}_cross_repository_scan" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Report that source intake is not yet authorized
        if: ${{ steps.app-config.outputs.enabled != 'true' }}
        run: |
          echo "Cross-repository intake remains disabled."
          echo "Configure EGM_REVIEW_APP_CLIENT_ID and EGM_REVIEW_APP_PRIVATE_KEY after installing the read-only App on the three registered source repositories."
          echo "No source repository was queried and no PR was created."
