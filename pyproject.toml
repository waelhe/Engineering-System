[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egm-engineering-system"
version = "0.1.0"
description = "EGM-based engineering knowledge and development system"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema[format-nongpl]==4.25.1"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.setuptools]
py-modules = []
